<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>四路并行字幕 · TMCRA</title><link rel="stylesheet" href="/assets/parallel.css"></head>
<body><main><header><div><span class="eyebrow">TMCRA · LIVE CAPTIONS</span><h1>四路并行字幕</h1><p id="meetingTitle">正在连接当前会议…</p></div><span class="badge" id="captureState">连接中</span></header>
<aside class="notice">此页只处理字幕，不操作麦克风。请保持原录音工作台标签页打开；结束录音仍在原工作台操作。</aside>
<section class="controls" aria-label="并行字幕设置"><button id="toggle" disabled>暂停翻译</button><label>模式<select id="mode" aria-label="字幕辅助模式"><option value="full">整句翻译</option><option value="assisted">整句 + 生词</option><option value="vocabulary">仅生词提示</option></select></label><label>目标语言<select id="language" aria-label="字幕目标语言"><option value="zh-CN">简体中文</option><option value="en">English</option></select></label><button id="retry" disabled>重试失败字幕</button><label class="check"><input type="checkbox" id="follow" checked>跟随最新内容</label></section>
<p class="policy">最多 4 个请求同时运行 · 最新句优先 · 其余通道补积压 · 按发言顺序展示</p>
<section class="metrics" aria-label="并行翻译状态"><div><strong id="active">0 / 4</strong><span>模型请求进行中</span></div><div><strong id="pending">0</strong><span>等待处理</span></div><div><strong id="done">0</strong><span>已处理</span></div><div><strong id="errors">0</strong><span>未完成</span></div></section>
<p id="status" role="status">正在连接…</p><p class="background" id="background"></p><section id="rows" aria-label="实时并行字幕"><p class="empty">等待定稿原文。</p></section><footer>模型译文及解释不是原文；说话人编号不代表身份。原文始终保留。</footer></main><script type="module" src="/assets/parallel-ui.mjs"></script></body></html>
