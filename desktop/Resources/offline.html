<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TMCRA 随堂助手</title>
<style>*{box-sizing:border-box}body{margin:0;font:15px -apple-system,BlinkMacSystemFont,sans-serif;background:#f6f7fb;color:#27354d}main{max-width:700px;padding:70px 35px;margin:auto}small{color:#5666d8;letter-spacing:2px}h1{font-size:34px;margin:20px 0}p{color:#64718a;line-height:1.9}section{background:white;border:1px solid #e0e5ef;border-radius:16px;padding:28px;margin-top:30px}button{font:inherit;border:1px solid #dce2ef;background:white;color:#394c6c;border-radius:8px;padding:12px 18px;cursor:pointer}button.primary{background:#5664d8;color:white;border-color:#5664d8;margin-right:10px}.badge{display:inline-block;font-size:12px;background:#eaf0fa;border-radius:20px;padding:5px 10px}li{line-height:2;color:#64718a}</style>
<main><small>TMCRA · DESKTOP COMPANION</small><h1>让理解留在视线里。</h1><p>主窗口可以收起，录音控制和随堂提示仍留在桌面。<br>连接你已经部署的学习工作台，不改动原有 TMCRA 桌面端。</p><section><span class="badge">当前未连接服务器</span><h2>准备好时，再开始聆听。</h2><p id="offlineMessage">学习服务启动后，点击连接即可。现在也可以离线检查悬浮窗交互，演示不使用麦克风、不调用模型。</p><button class="primary" onclick="window.webkit.messageHandlers.desktop.postMessage({type:'action',action:'connect'})">连接学习服务</button><button onclick="window.webkit.messageHandlers.desktop.postMessage({type:'action',action:'demo'})">离线演示</button></section><ul><li>浮窗控制开始／停止，主窗口最小化后仍可操作。</li><li>提示显示可以单独关闭，不影响录音。</li><li>收起浮窗后，可从菜单栏重新打开。</li></ul></main></html>
