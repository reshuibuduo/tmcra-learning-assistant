<!doctype html><html lang="zh-CN" data-desktop-demo="true"><meta charset="utf-8"><title>悬浮窗离线演示</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fc;color:#283750;font:15px -apple-system,sans-serif}main{max-width:800px;margin:auto;padding:35px}h1{font-size:28px}p{line-height:1.9}section{border:1px solid #dfe6f0;border-radius:14px;background:white;padding:24px;margin:20px 0}.banner{color:#96581b;background:#fff4e1;padding:14px;border-radius:8px;font-size:13px}.controls{display:flex;gap:12px;align-items:center}button{font:inherit;border:1px solid #dae1ee;background:white;border-radius:8px;padding:11px 16px;color:#42577a;cursor:pointer}button.primary{background:#5967dc;color:white;border-color:#5967dc}button.stop{background:#fff1f1;color:#aa4149}input{font:inherit;width:100%;border:0;font-size:20px;font-weight:600;margin-bottom:12px;color:#334467}.meta{display:flex;gap:20px;color:#73809a;margin:12px 0 20px}.concept-example{background:#f4f6fd;border-radius:8px;padding:4px 16px}.source-quote{font-size:12px;color:#73809a}small{color:#5967dc}.muted{color:#73809a;font-size:13px}#servicePill{display:none}[hidden]{display:none!important}</style>
<main><div class="banner">离线演示：状态与提示均为测试数据，不采集麦克风，不连接服务器或 AI。</div><h1>把主窗口最小化，试试浮窗。</h1><p class="muted">浮窗与这里共用同一组控制；关闭提示不会停止模拟录音。</p><section><span id="servicePill" class="connected"></span><input id="sessionTitle" value="悬浮窗交互演示" readonly><div class="meta"><span id="sessionStatus">演示已就绪</span><span id="duration">00:00</span></div><div class="controls"><button id="recordButton" class="primary">开始模拟录音</button><button id="stopButton" class="stop" hidden>停止模拟录音</button><button id="nextHint">切换示例提示</button></div></section><section id="conceptCard"><small>演示提示 · 非模型实时输出</small><h3>梯度下降</h3><p class="concept-intuition">每次朝错误更小的方向调整一点，逐步找到更合适的参数。</p><div class="concept-example"><p>像沿着山坡向低处走，每一步不用很大，但方向要对。</p></div><p class="source-quote">这一步我们用梯度下降更新模型参数。</p></section><p class="muted">返回真实服务：点击窗口顶部“连接服务”。开始真实录音仍需麦克风授权。</p></main>
<script>
const $=id=>document.getElementById(id); let timer=null,seconds=0,index=0;
const cards=[['梯度下降','每次朝错误更小的方向调整一点，逐步找到更合适的参数。','像沿着山坡向低处走，每一步不用很大，但方向要对。'],['过拟合','模型过度记住练习题的细节，遇到新题时反而表现不好。','像只背答案而没理解方法，换一种问法就容易出错。'],['向量','把多个数按顺序放在一起，用来表示一个有多个维度的信息。','用身高、体重和年龄三个数，组成一个简单的特征向量。']];
function hint(){const c=cards[index++%cards.length];document.querySelector('#conceptCard h3').textContent=c[0];document.querySelector('.concept-intuition').textContent=c[1];document.querySelector('.concept-example p').textContent=c[2];document.querySelector('.source-quote').textContent='演示讲解：'+c[0];}
$('recordButton').onclick=()=>{if(timer)return;$('recordButton').hidden=true;$('stopButton').hidden=false;$('sessionStatus').textContent='模拟采集中 · 没有使用麦克风';timer=setInterval(()=>{seconds++;$('duration').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');if(seconds%6===0)hint();},1000);};
$('stopButton').onclick=()=>{clearInterval(timer);timer=null;$('recordButton').hidden=false;$('stopButton').hidden=true;$('sessionStatus').textContent='模拟采集已停止';};$('nextHint').onclick=hint;
</script></html>
